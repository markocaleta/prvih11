services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prvih11
      POSTGRES_USER: prvih11
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nije postavljen u .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prvih11 -d prvih11"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: